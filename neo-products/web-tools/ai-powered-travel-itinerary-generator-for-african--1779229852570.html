<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Travel Itinerary Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #181818;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            background: linear-gradient(145deg, #1e1e1e, #131313);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 8px 8px 15px #0b0b0b, -8px -8px 15px #222222;
            width: 100%;
            max-width: 600px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            box-shadow: 2px 2px 5px #0b0b0b, -2px -2px 5px #222222;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 16px;
        }

        button {
            background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
        }

        .loading {
            display: none;
            margin-top: 10px;
            color: #f39c12;
        }

        .results {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 5px #0b0b0b, -2px -2px 5px #222222;
        }

        .error {
            color: #e74c3c;
        }

        @media (max-width: 600px) {
            input, select, button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h1>AI-Powered Travel Itinerary Generator</h1>
    <div class="container">
        <select id="destination">
            <option value="">Select a Destination</option>
            <option value="Kenya">Kenya</option>
            <option value="South Africa">South Africa</option>
            <option value="Morocco">Morocco</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Egypt">Egypt</option>
        </select>

        <input type="number" id="days" placeholder="Number of Days" min="1" />

        <button id="generate">Generate Itinerary</button>
        <p class="loading" id="loading">Loading...</p>
        <div class="results" id="results"></div>
        <p class="error" id="error"></p>
    </div>

    <script>
        document.getElementById('generate').addEventListener('click', async () => {
            const destination = document.getElementById('destination').value;
            const days = document.getElementById('days').value;
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');

            loading.style.display = 'none';
            results.innerHTML = '';
            error.innerHTML = '';

            if (!destination || days <= 0) {
                error.innerHTML = 'Please select a destination and enter a valid number of days.';
                return;
            }

            loading.style.display = 'block';

            try {
                const response = await fetch(`https://api.example.com/getItinerary?destination=${destination}&days=${days}`);
                const data = await response.json();

                if (!data || !data.itinerary) {
                    throw new Error('No itinerary found.');
                }

                results.innerHTML = `<h2>Your Itinerary for ${days} Days in ${destination}</h2><pre>${JSON.stringify(data.itinerary, null, 2)}</pre>`;
            } catch (err) {
                error.innerHTML = 'Error generating itinerary: ' + err.message;
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
