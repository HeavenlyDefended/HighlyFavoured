<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering Personal Development with AI: A Guided Journal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            text-align: center;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .journal-container {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border: none;
            border-radius: 5px;
            padding: 10px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            resize: none;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        button {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            border-radius: 5px;
            padding: 10px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: linear-gradient(45deg, #2575fc, #6a11cb);
        }

        .loading {
            display: none;
            font-size: 1.2em;
            text-align: center;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>

    <h1>Guided Journal</h1>
    <div class="journal-container">
        <textarea id="journalEntry" placeholder="Write your thoughts, reflections, or goals..."></textarea>
        <button id="submitBtn">Submit Entry</button>
        <div class="loading" id="loading">Loading...</div>
        <div id="response" class="response"></div>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const entry = document.getElementById('journalEntry').value;
            if (!entry) {
                alert("Please enter your journal entry.");
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('response').textContent = '';

            try {
                const response = await fetch('https://api.example.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ entry }),
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                document.getElementById('response').textContent = 'Entry submitted successfully!';
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('journalEntry').value = '';
            }
        });
    </script>

</body>
</html>
